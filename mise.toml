# =============================================================================
# mise.toml - pnpm (TypeScript) template
# Overlays the base mise.toml during scaffold. Tasks are file tasks under
# mise-tasks/ (this template overrides only the tasks that differ from base).
# =============================================================================

[env]
_.path   = ['{{config_root}}/node_modules/.bin']
PROJECT  = "diffwiki"
TEMPLATE         = "mise-pnpm-template"
VERSION  = "{{exec(command='node -p \"require(\\\"./package.json\\\").version\" 2>/dev/null || echo 0.1.0')}}"

[tools]
node       = "lts"
pnpm       = "10"
bats       = "latest"
shellcheck = "latest"
shfmt      = "latest"
# Search-plugin tools so the e2e suites can assume ripgrep + qmd exist rather
# than gate on them. Missing-tool paths are covered by dedicated tests (the
# diffwiki-qmd adapter unit tests and the plugin-install not-ready e2e).
ripgrep           = "latest"
"npm:@tobilu/qmd" = "2.5.3"

[task_config]
includes = ["mise-tasks"]

[settings]
experimental = true
